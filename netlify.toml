# Netlify: site (pasta preparada por `npm run preview`) + funções do agente
[build]
  publish = "_publicar/ecomulti-preview"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# o painel e a API nunca devem ir para a cache nem para o Google
[[headers]]
  for = "/painel.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/blog-admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
