# Netlify: site (pasta preparada por `npm run preview`) + funções do agente
# Publicação a partir do GitHub: cada push para o main gera de novo a pasta e publica.
[build]
  command = "npm run preview"
  publish = "_publicar/ecomulti-preview"

[build.environment]
  # @netlify/blobs 11 exige Node 22.12 ou superior
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# o painel e a API nunca devem ir para a cache nem para o Google
[[headers]]
  for = "/painel.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/blog-admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
