<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a1747">
  <title>Área reservada | ECOMULTI</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/blog.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="adm">
  <script src="assets/js/icons.js"></script>

  <!-- ================= LOGIN ================= -->
  <main class="adm-login" id="telaLogin">
    <form class="adm-login-card" id="formLogin" novalidate>
      <a class="adm-login-logo" href="index.html" aria-label="Voltar ao site"><img src="assets/img/logo-ecomulti.png" alt="ECOMULTI" width="520" height="158"></a>
      <span class="adm-lock" aria-hidden="true"><svg class="icon"><use href="#i-lock"/></svg></span>
      <h1>Área reservada</h1>
      <p class="adm-sub">Entre para gerir o blog, as vendas, os clientes e os leads.</p>
      <label>E-mail
        <input id="lgEmail" type="email" autocomplete="username" inputmode="email" required>
      </label>
      <label>Senha
        <span class="adm-pass"><input id="lgSenha" type="password" autocomplete="current-password" required><button type="button" id="verSenha" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></span>
      </label>
      <p class="adm-erro" id="lgErro" role="alert"></p>
      <button class="btn btn-primary btn-block" id="lgBtn" type="submit">Entrar</button>
      <a class="adm-voltar" href="index.html">← Voltar ao site</a>
    </form>
  </main>

  <!-- ================= DASHBOARD ================= -->
  <div class="adm-app" id="telaApp" hidden>
    <aside class="adm-side" id="lateral" aria-label="Menu do dashboard">
      <a class="adm-brand" href="index.html" target="_blank" rel="noopener"><img src="assets/img/logo-ecomulti-branco.png" alt="ECOMULTI" width="520" height="158"></a>
      <nav>
        <button type="button" data-v="resumo"><svg class="icon"><use href="#i-chart"/></svg> Resumo</button>
        <button type="button" data-v="vendas"><svg class="icon"><use href="#i-cart"/></svg> Vendas <b id="nbAberto" hidden></b></button>
        <button type="button" data-v="clientes"><svg class="icon"><use href="#i-people"/></svg> Clientes</button>
        <button type="button" data-v="subscricoes"><svg class="icon"><use href="#i-clock"/></svg> Subscrições</button>
        <button type="button" data-v="blog"><svg class="icon"><use href="#i-file"/></svg> Blog e secções</button>
        <button type="button" data-v="leads"><svg class="icon"><use href="#i-mail"/></svg> Newsletter e leads</button>
        <button type="button" data-v="conta"><svg class="icon"><use href="#i-lock"/></svg> Conta e segurança</button>
      </nav>
      <div class="adm-side-foot">
        <span id="uEmail"></span>
        <button type="button" id="btnSair">Terminar sessão</button>
      </div>
    </aside>
    <div class="adm-scrim" id="scrim" hidden></div>
    <div class="adm-main">
      <header class="adm-top">
        <button class="adm-burger" id="burger" type="button" aria-label="Abrir menu" aria-controls="lateral"><svg class="icon"><use href="#i-menu"/></svg></button>
        <h1 id="titulo">Resumo</h1>
        <span class="adm-grow"></span>
        <div id="accoesTopo"></div>
      </header>
      <div class="adm-aviso" id="avisoSenha" hidden>
        <svg class="icon"><use href="#i-shield"/></svg>
        <span><strong>Está a usar a senha inicial.</strong> Por segurança, altere-a agora em <a href="#conta">Conta e segurança</a>.</span>
      </div>
      <main class="adm-vista" id="vista" tabindex="-1"></main>
    </div>
  </div>

  <dialog class="adm-modal" id="modal"></dialog>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/blog.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
